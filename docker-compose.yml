services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rekadigi-api
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rekadigi
      DATABASE_POOL_MAX: 10
      DATABASE_IDLE_TIMEOUT_MS: 30000
      DATABASE_CONNECTION_TIMEOUT_MS: 5000
      LOG_LEVEL: info

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: rekadigi-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rekadigi

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d rekadigi"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: